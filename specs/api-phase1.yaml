      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../frontend/scripts/openapi-snapshot.json#/components/schemas/InviteCreateResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
