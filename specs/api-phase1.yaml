      tags:
        - admin
        - migrations
      parameters:
        - name: migration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Migration Id
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
