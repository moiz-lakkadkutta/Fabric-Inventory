  /reports/gstr1:
    get:
      summary: Get GSTR-1 buckets (B2B / B2CL / B2CS / Export / HSN / CDNR / CDNUR) for a period
      operationId: getGstr1
      tags:
        - reports
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/FirmId'
        - name: period
          in: query
          required: true
          description: Period as YYYY-MM (Indian fiscal month).
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: |
            GSTR-1 envelope — buckets keyed by category. With
            `format=xlsx` returns a multi-sheet workbook (B2B / B2CL /
            B2CS / Export / HSN / CDNR / CDNUR as separate sheets). With
            `format=csv` flattens the B2B bucket only (use xlsx for the
            full filing).

            CREDIT NOTES (#199, additive): a finalized invoice cancelled in a
            LATER month (Asia/Kolkata) than its invoice date is a CGST Act
            §34 credit note. The original invoice STILL appears in its own
            month's buckets; the month the CREDIT_NOTE voucher is dated
            reports it as: `cdnr` (original was B2B — `Gstr1CdnrRow` with
            recipient `gstin`, masked like B2B), `cdnur` (original was B2CL
            or export — `Gstr1CdnurRow` with `ur_type` B2CL / EXPWP /
            EXPWOP), or, for a B2CS original, a negative adjustment netted
            into that month's `b2cs` row for the same (state, rate) — a
            negative row with `invoice_count` 0 if there were no sales. Each
            credit-note row is per (note, slab rate) with note number/date
            (#216: `note_no` / `invoice_no` carry the FULL numbers, e.g.
            "CN/26-27/0001", and the XLSX "Note #" / "Original invoice #"
            columns use them),
            original invoice number/date, place of supply, `note_value`,
            `taxable_value`, CGST/SGST/IGST and `note_type` "C"; amounts are
            POSITIVE (the note type carries the sign). `hsn` is net of every
            credit note in the period. A same-month cancel is excluded from
            every section.

            RATE-WISE (BREAKING SHAPE CHANGE, #195): the return is
            statutory rate-wise. b2b / b2cl / export emit ONE ROW PER
            (invoice, slab rate) — a mixed-rate invoice yields several
            rows, each with `gst_rate` a real slab (0 / 0.25 / 3 / 5 /
            12 / 18 / 28, never a blended per-invoice rate), `taxable_value`
            the taxable amount AT THAT RATE, and `invoice_value` the header
            total repeated on every row. `Gstr1InvoiceRow.gst_rate` is now
            non-nullable. b2cs groups by (state, slab rate); its
            `invoice_count` counts DISTINCT invoices, not rate-rows. The
            hsn rows are rate-wise too and each carries a new `gst_rate`
            field (added to the XLSX HSN sheet as a "GST rate %" column).
            CGST == SGST on every intra-state row (each half =
            round(taxable × rate / 200)).
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >-
            Firm is not GST-registered (#194): a firm with `has_gst = false`
            has no GST return to file, so GSTR-1 (JSON, XLSX, and CSV export
            paths) is refused with a "not GST-registered" detail rather than
            an empty/misleading dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-permission: accounting.report.view

