    post:
      summary: Create purchase invoice
      description: >
        Creates a DRAFT PI. When linked to a GRN (#200): the GRN must be
        ACKNOWLEDGED, every billed item must exist on the GRN, and billed qty
        per item must not exceed the GRN's received qty for that item — else
