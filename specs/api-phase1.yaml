  /manufacturing/mo/{mo_id}/complete:
    post:
      summary: Complete (IN_PROGRESS → COMPLETED) a manufacturing order with WIP settlement — TASK-TR-A11
      description: 'Money-touching: drains the WIP cost pool into finished-goods inventory. Posts a balanced
        GL voucher (DR 1300 Inventory / CR 1310 Work-in-Process) for the full pool, inserts an inbound stock-ledger
        row for the finished item at the firm''s MAIN warehouse with unit_cost = cost_pool / produced_qty, then
        flips the MO header to COMPLETED. With completion_policy=ALL_OR_NONE (the default and only v1 policy)
        the request''s produced_qty must equal planned_qty. All operations must be in {CLOSED, SKIPPED, CANCELLED}
        — REWORK QC verdicts block completion until the rework cycle finishes.'
      operationId: completeMo
      tags:
        - manufacturing
        - mo
      parameters:
        - name: mo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Mo Id
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../frontend/scripts/openapi-snapshot.json#/components/schemas/MoCompleteRequest
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../frontend/scripts/openapi-snapshot.json#/components/schemas/MoResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../frontend/scripts/openapi-snapshot.json#/components/schemas/HTTPValidationError
      x-permission: manufacturing.mo.write

  /manufacturing/mo/{mo_id}/completion-preview:
    get:
      summary: Preview the MO completion + WIP settlement that A11 would post (read-only) — TASK-TR-A11-FU
      description: 'Read-only: returns the cost pool, per-unit cost, and loss breakdown that ``POST /manufacturing/mo/{id}/complete``
        would post for the given ``produced_qty_target``, plus a list of ``blocking_reasons`` populated when
        any pre-flight check fails (MO not IN_PROGRESS, an op not in {CLOSED, SKIPPED, CANCELLED}, ALL_OR_NONE
        policy mismatch, non-zero rework_qty, empty WIP cost pool, etc.). ``can_complete`` is False whenever
        ``blocking_reasons`` is non-empty; the response is still 200 — the FE renders the numbers AND the reason
        in one round trip. No state changes, no GL writes, no audit emit.'
      operationId: completionPreview
      tags:
        - manufacturing
        - mo
      parameters:
        - name: mo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Mo Id
        - name: firm_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            title: Firm Id
        - name: produced_qty_target
          in: query
          required: true
          schema:
            anyOf:
              - type: number
                exclusiveMinimum: 0.0
              - type: string
                pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            title: Produced Qty Target
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../frontend/scripts/openapi-snapshot.json#/components/schemas/MoCompletionPreviewResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../frontend/scripts/openapi-snapshot.json#/components/schemas/HTTPValidationError
      x-permission: manufacturing.mo.read

