openapi: 3.1.0
info:
  title: Fabric ERP API
  version: 0.1.0-phase1
  description: |
    Multi-tenant SaaS ERP for ladies-suit / fabric trade (Phase 1 scope).

    This file is the contract for EVERY route the app serves, manufacturing included
    (Q01-12). `specs/api-phase3.yaml` is a design document only.

    - `x-permission` is the permission the route enforces through
      `require_permission(...)`. The code is the source of truth. Routes with no
      permission are `public`, or `authenticated` when they need a logged-in user.
    - `x-implemented: false` marks a designed operation that no route serves yet.
    - Operations added from the implemented API reference their schemas in
      `frontend/scripts/openapi-snapshot.json` (refresh it with `make openapi-snapshot`).
    - Guard: `backend/tests/test_spec_permission_parity.py`. To fix drift, run
      `cd backend && uv run python -m scripts.spec_sync --write`, then review the diff.
  contact:
    name: Fabric ERP Team
  license:
    name: Proprietary

servers:
  - url: https://api.fabric-erp.com/v1
    description: Production API
  - url: http://localhost:8000/v1
    description: Local development

tags:
  - name: identity
    description: Authentication, users, roles, firms
  - name: masters
    description: Party, Item, SKU, ledgers, price lists, COA
  - name: procurement
    description: Purchase orders, GRN, invoices, returns, landed costs
  - name: inventory
    description: Stock positions, ATP, lots, adjustments, stock-takes, transfers, consignment
  - name: sales
    description: Quotations, sales orders, delivery challans, invoices, returns
  - name: accounting
    description: Vouchers, bank accounts, cheques, expenses, fixed assets, periods
  - name: reports
    description: Day-book, trial balance, P&L, balance sheet, ledger, ageing, stock summary
  - name: platform
    description: Audit log, feature flags, notifications, exports

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  parameters:
    OrgId:
      name: X-Org-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Organization UUID (tenant ID)

    FirmId:
      name: X-Firm-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Firm UUID within the organization

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
      description: Number of items per page

    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true
      description: Cursor token for pagination

    Filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: Filter query (e.g., status=DRAFT, name~Jane)

    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: created_at:desc
      description: Sort field and direction (field:asc|desc)

    Include:
      name: include
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated related resources (e.g., lines, addresses)

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated UUID v4 that makes a mutating request idempotent. Required on
        every POST/PATCH/PUT/DELETE except the auth-by-design routes (/auth/login,
        /auth/signup, /auth/refresh, /auth/forgot, /auth/reset, /admin/invites/accept);
        missing or non-UUID → 400 IDEMPOTENCY_KEY_REQUIRED. Critical for offline
        Android sync and flaky-network retries.

        Semantics (Q01-01/Q01-04, implemented in the idempotency middleware):
        - Scope: the key is namespaced per authenticated principal (org + user, taken
          from the verified access token — so a retry after a token refresh still
          dedupes), HTTP method and path. Requests without a valid access token are
          never deduplicated or replayed; the handler runs and returns 401.
        - Retry of a completed 2xx with the same body (within 24 h) → the original
          response is replayed; the handler does not run again.
        - Same key, different body → 409 IDEMPOTENCY_KEY_PAYLOAD_MISMATCH.
        - Same key while the first request is still executing → 409
          IDEMPOTENCY_REQUEST_IN_PROGRESS with a Retry-After header; retry shortly and
          the retry is replayed once the first request finishes.
        - Non-2xx outcomes are not replayed: 4xx (except 401/403) keep only a body
          hash for mismatch detection and the retry re-executes; 401/403/5xx (incl. a
          failed commit) store nothing.
        - Responses carrying credentials or secrets (/auth/switch-firm,
          /auth/mfa-verify, /auth/mfa/setup, /auth/mfa/confirm, /auth/logout, or any
          body with token/secret fields) are never cached; a retry re-executes.
      schema:
        type: string
        maxLength: 100
        pattern: "^[A-Za-z0-9_-]{8,100}$"

    ExportFormat:
      name: format
      in: query
      required: false
      description: |
        TASK-CUT-403: when set, the endpoint returns a downloadable file
        instead of JSON. `csv` returns `text/csv` (UTF-8 with BOM,
        Excel-friendly); `xlsx` returns an Excel workbook. Permissions
        inherit from the JSON list — anyone who can list can export.
        GSTR-1's xlsx export is multi-sheet (B2B / B2CL / B2CS / Export / HSN).
      schema:
        type: string
        enum: [csv, xlsx]

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: |
        Insufficient permissions. Permissions are granted per firm (or
        org-wide). Firm scope (Q01-02): when the request names a `firm_id`
        (path, query string or top-level JSON body) other than the token's
        active firm, the endpoint's `x-permission` must ALSO be granted in
        that firm (firm-scoped role or org-wide role); otherwise 403 with
        title "No access to that firm". A `firm_id` that does not exist in
        the caller's organisation is never answered with this 403 — the
        endpoint responds exactly as for any unknown firm (404/422), so firm
        existence in other orgs is not revealed. Invites / role changes /
        custom-role edits are capped by the actor's permissions in the scope
        being granted (org-wide grants need an org-wide admin).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: |
        Resource not found. Also returned (never 403) for a resource that
        exists in the caller's org but in a firm outside the caller's firm
        scope (Q01-02, enforced by RESTRICTIVE firm RLS) — the same
        invisibility as a cross-org id. List endpoints without a `firm_id`
        filter likewise return only rows of firms in scope (plus org-shared
        masters with no firm).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |
        Conflict (e.g., duplicate, invalid state), or an Idempotency-Key conflict:
        IDEMPOTENCY_KEY_PAYLOAD_MISMATCH (same key, different body) or
        IDEMPOTENCY_REQUEST_IN_PROGRESS (same key still executing; honour Retry-After).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnprocessableEntity:
      description: Validation error (e.g., over-receipt, cross-PO line, qty mismatch)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - status
        - title
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI per RFC 9457
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Short human-readable title
        detail:
          type: string
          description: Detailed explanation
        instance:
          type: string
          format: uri
          description: URI of the specific problem instance
        errors:
          type: object
          additionalProperties: true
          description: Field-level error details

    ErrorEnvelope:
      type: object
      description: >-
        The error body the app actually returns (Q8a envelope, `app/middleware/errors.py`)
        for every AppError, request-validation error and unhandled 500. Operations added
        from the implemented API reference this for documented business refusals.
      required: [code, title, detail, status, field_errors, request_id]
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. VALIDATION_ERROR
        title:
          type: string
        detail:
          type: string
          description: Actionable human-readable message
        status:
          type: integer
        field_errors:
          type: object
          additionalProperties: true
          description: Dotted-key map of field errors (empty for business refusals)
        request_id:
          type: string

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required:
        - items
        - has_more

    TaxStatus:
      type: string
      enum:
        - REGULAR
        - COMPOSITION
        - UNREGISTERED
        - CONSUMER
        - OVERSEAS

    VoucherStatus:
      type: string
      enum:
        - DRAFT
        - POSTED
        - RECONCILED
        - VOIDED

    MOStatus:
      type: string
      enum:
        - DRAFT
        - RELEASED
        - IN_PROGRESS
        - COMPLETED
        - CLOSED

    PurchaseOrderStatus:
      type: string
      enum:
        - DRAFT
        - APPROVED
        - CONFIRMED
        - PARTIAL_GRN
        - FULLY_RECEIVED
        - CANCELLED

    SalesOrderStatus:
      type: string
      enum:
        - DRAFT
        - CONFIRMED
        - PARTIAL_DC
        - FULLY_DISPATCHED
        - INVOICED
        - CANCELLED

    QuoteStatus:
      type: string
      enum:
        - DRAFT
        - SENT
        - NEGOTIATING
        - WON
        - LOST
        - EXPIRED
        - CONVERTED

    ChallanStatus:
      type: string
      enum:
        - DRAFT
        - ISSUED
        - ACKNOWLEDGED
        - IN_PROCESS
        - RETURNED
        - CLOSED

    ItemType:
      type: string
      enum:
        - RAW
        - SEMI_FINISHED
        - FINISHED
        - SERVICE
        - CONSUMABLE
        - BY_PRODUCT
        - SCRAP

    TrackingType:
      type: string
      enum:
        - NONE
        - BATCH
        - LOT
        - SERIAL

    PartyType:
      type: string
      enum:
        - SUPPLIER
        - CUSTOMER
        - KARIGAR
        - TRANSPORTER
        - OTHER

    UOMType:
      type: string
      enum:
        - METER
        - PIECE
        - KG
        - LITER
        - SET
        - GROSS
        - DOZEN
        - ROLL
        - BUNDLE
        - OTHER

    VoucherType:
      type: string
      enum:
        - SALES_INVOICE
        - PURCHASE_INVOICE
        - PAYMENT
        - RECEIPT
        - JOURNAL
        - CONTRA
        - DEBIT_NOTE
        - CREDIT_NOTE
        - OPENING_BAL

    PaymentMode:
      type: string
      enum:
        - CASH
        - BANK_TRANSFER
        - CHEQUE
        - UPI
        - CREDIT
        - NEFT
        - RTGS
        - DD
        - CARD

    JournalLineType:
      type: string
      enum:
        - DR
        - CR

    ChequeStatus:
      type: string
      enum:
        - ISSUED
        - CLEARED
        - BOUNCED
        - POST_DATED
        - STOPPED
        - CANCELLED

    Party:
      type: object
      required:
        - name
        - tax_status
      properties:
        party_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
          nullable: true
        tax_status:
          $ref: '#/components/schemas/TaxStatus'
        gstin:
          type: string
          maxLength: 15
          nullable: true
          description: Encrypted in DB; decrypted on retrieval if user has view permission
        pan:
          type: string
          maxLength: 10
          nullable: true
        state_code:
          type: string
          maxLength: 2
          nullable: true
          description: >-
            Indian GST state code. Accepts a 2-digit numeric GST-schedule code
            (e.g. "27") or a 2-char ISO 3166-2:IN alphabetic abbreviation
            (e.g. "MH"); numeric input is canonicalised to alpha on store.
            An unrecognised value (e.g. "XX") is rejected with 422 — the same
            rule invoices apply to ship_to_state (#193). Empty string / null
            clears the field (PATCH-clear).
        is_supplier:
          type: boolean
          default: false
        is_customer:
          type: boolean
          default: false
        is_karigar:
          type: boolean
          default: false
        is_transporter:
          type: boolean
          default: false
        credit_limit:
          type: number
          format: double
          nullable: true
        credit_days:
          type: integer
          nullable: true
        default_price_list_id:
          type: string
          format: uuid
          nullable: true
        addresses:
          type: array
          items:
            type: object
            description: See party_address table in DDL
        bank_accounts:
          type: array
          items:
            type: object
            description: See party_bank_account table in DDL
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Item:
      type: object
      required:
        - code
        - name
        - item_type
        - primary_uom
      properties:
        item_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        item_type:
          $ref: '#/components/schemas/ItemType'
        category:
          type: string
          maxLength: 100
          nullable: true
        primary_uom:
          $ref: '#/components/schemas/UOMType'
        tracking:
          $ref: '#/components/schemas/TrackingType'
          default: NONE
        hsn_code:
          type: string
          maxLength: 8
          nullable: true
        gst_rate:
          type: number
          format: double
          nullable: true
        skus:
          type: array
          items:
            $ref: '#/components/schemas/SKU'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SKU:
      type: object
      required:
        - item_id
        - code
      properties:
        sku_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 100
        variant_map:
          type: object
          additionalProperties: true
          description: "JSON map of variant axes (e.g., {size: M, color: RED})"
        barcode:
          type: string
          nullable: true
        warehouse_code:
          type: string
          nullable: true
        standard_cost:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Voucher:
      type: object
      required:
        - voucher_type
        - voucher_date
      properties:
        voucher_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        firm_id:
          type: string
          format: uuid
        voucher_type:
          $ref: '#/components/schemas/VoucherType'
        voucher_number:
          type: string
          maxLength: 50
          nullable: true
          description: Null until posted
        voucher_date:
          type: string
          format: date
        reference_number:
          type: string
          maxLength: 100
          nullable: true
        reference_date:
          type: string
          format: date
          nullable: true
        party_id:
          type: string
          format: uuid
          nullable: true
        ledger_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/VoucherStatus'
          default: DRAFT
        notes:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/VoucherLine'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VoucherLine:
      type: object
      required:
        - ledger_id
        - amount
        - line_type
      properties:
        voucher_line_id:
          type: string
          format: uuid
        voucher_id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        line_type:
          $ref: '#/components/schemas/JournalLineType'
        amount:
          type: number
          format: double
        description:
          type: string
          nullable: true
        reference_id:
          type: string
          format: uuid
          nullable: true
          description: Ref to PO, GRN, Invoice, etc.
        cost_centre_id:
          type: string
          format: uuid
          nullable: true

    Invoice:
      type: object
      required:
        - party_id
        - invoice_date
      properties:
        invoice_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        firm_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          maxLength: 50
          nullable: true
        invoice_date:
          type: string
          format: date
        party_id:
          type: string
          format: uuid
        sales_order_id:
          type: string
          format: uuid
          nullable: true
        delivery_challan_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Delivery challan this invoice bills (DEBT-02). One invoice bills
            one challan; a challan is held by at most one live invoice
            (DRAFT included; cancelling frees it). On finalize the invoice
            posts COGS from the challan's dispatch and does not relieve stock
            a second time.
        tax_regime:
          type: string
          enum:
            - GST
            - NON_GST
        total_amount:
          type: number
          format: double
        tax_amount:
          type: number
          format: double
          nullable: true
        net_amount:
          type: number
          format: double
        status:
          type: string
          enum:
            - DRAFT
            - FINALIZED
            - SENT
          default: DRAFT
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        credit_note:
          description: >-
            (#216) The CGST Act §34 credit note issued against this invoice —
            set only when it was CANCELLED in a later GST period than its
            invoice date. Null for a same-period cancellation (a true
            cancellation; no credit note is issued) and for every other
            status. PDF at GET /invoices/{invoice_id}/credit-note/pdf.
          nullable: true
          type: object
          properties:
            voucher_id:
              type: string
              format: uuid
            number:
              type: string
              maxLength: 16
              description: Full credit-note number, e.g. "CN/26-27/0001".
            note_date:
              type: string
              format: date

    InvoiceLine:
      type: object
      required:
        - sku_id
        - quantity
        - unit_rate
      properties:
        invoice_line_id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: double
          maximum: 1000000000
          description: >-
            #207: capped at 1e9. The derived line_amount (quantity * unit_rate)
            and the invoice total are additionally guarded server-side against
            the ₹1e9 ceiling, so a product/sum that overflows NUMERIC(18,2)
            returns 422 VALIDATION_ERROR, never 500.
        unit_rate:
          type: number
          format: double
          maximum: 1000000000
        line_amount:
          type: number
          format: double
        tax_rate:
          type: number
          format: double
          nullable: true
        tax_amount:
          type: number
          format: double
          nullable: true
        description:
          type: string
          nullable: true

    PurchaseInvoice:
      type: object
      required:
        - party_id
        - invoice_date
      properties:
        purchase_invoice_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        firm_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          maxLength: 50
        invoice_date:
          type: string
          format: date
        party_id:
          type: string
          format: uuid
        purchase_order_id:
          type: string
          format: uuid
          nullable: true
        grn_ids:
          type: array
          items:
            type: string
            format: uuid
        total_amount:
          type: number
          format: double
        tax_amount:
          type: number
          format: double
          nullable: true
        net_amount:
          type: number
          format: double
        status:
          type: string
          enum:
            - DRAFT
            - MATCHED
            - INVOICED
            - PAID
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceLine'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PurchaseInvoiceLine:
      type: object
      required:
        - item_id
        - quantity
        - unit_rate
      properties:
        purchase_invoice_line_id:
          type: string
          format: uuid
        purchase_invoice_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: double
        unit_rate:
          type: number
          format: double
        line_amount:
          type: number
          format: double
        tax_rate:
          type: number
          format: double
          nullable: true
        tax_amount:
          type: number
          format: double
          nullable: true

    StockPosition:
      type: object
      properties:
        stock_position_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        firm_id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        available_qty:
          type: number
          format: double
        reserved_qty:
          type: number
          format: double
        in_transit_qty:
          type: number
          format: double
        cost_value:
          type: number
          format: double
        valuation_method:
          type: string
          enum:
            - FIFO
            - MOVING_AVERAGE
        updated_at:
          type: string
          format: date-time

    Lot:
      type: object
      required:
        - sku_id
        - lot_number
      properties:
        lot_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        firm_id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        lot_number:
          type: string
          maxLength: 100
        received_date:
          type: string
          format: date
        supplier_batch:
          type: string
          maxLength: 100
          nullable: true
        attributes:
          type: object
          additionalProperties: true
          description: JSON object for lot-specific data (GSM, width, shade, etc.)
        total_qty:
          type: number
          format: double
        available_qty:
          type: number
          format: double
        standard_cost:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Bank reconciliation schemas (TASK-TR-B3) ──────────────────────────

    ConfirmedMatchRequest:
      type: object
      required:
        - statement_row_idx
        - voucher_id
        - statement_ref
        - statement_amount
      properties:
        statement_row_idx:
          type: integer
          minimum: 0
        voucher_id:
          type: string
          format: uuid
        statement_ref:
          type: string
          minLength: 1
          maxLength: 200
        statement_amount:
          type: number
          format: double
          description: >
            Amount from the bank statement row (rupees, positive magnitude).
            The service validates |voucher_total − |statement_amount|| ≤ ₹1.
            Use absolute value — sign convention varies across banks.

    BankReconciliationConfirmRequest:
      type: object
      required:
        - firm_id
        - bank_account_id
        - matches
      properties:
        firm_id:
          type: string
          format: uuid
        bank_account_id:
          type: string
          format: uuid
        matches:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ConfirmedMatchRequest'

    BankReconciliationConfirmResponse:
      type: object
      properties:
        bank_account_id:
          type: string
          format: uuid
        reconciled_voucher_ids:
          type: array
          items:
            type: string
            format: uuid
        skipped_already_reconciled:
          type: integer

    BankStatementRowRequest:
      type: object
      required:
        - statement_date
        - amount
      properties:
        statement_date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
          default: ''
        amount:
          type: number
          format: double
        balance:
          type: number
          format: double
          nullable: true

    BankReconciliationPreviewRequest:
      type: object
      required:
        - firm_id
        - bank_account_id
        - statement_rows
      properties:
        firm_id:
          type: string
          format: uuid
        bank_account_id:
          type: string
          format: uuid
        statement_rows:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/BankStatementRowRequest'

    BankReconciliationPreviewResponse:
      type: object
      properties:
        bank_account_id:
          type: string
          format: uuid
        statement_rows:
          type: array
          items:
            type: object
            properties:
              statement_row_idx:
                type: integer
              statement_date:
                type: string
                format: date
              description:
                type: string
              amount:
                type: number
                format: double
              balance:
                type: number
                format: double
                nullable: true
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    voucher_id:
                      type: string
                      format: uuid
                    score:
                      type: integer
                    voucher_type:
                      type: string
                    voucher_date:
                      type: string
                      format: date
                    series:
                      type: string
                    number:
                      type: string
                    narration:
                      type: string
                      nullable: true
                    amount:
                      type: number
                      format: double

    BankReconciliationUnmatchedAsVoucherRequest:
      type: object
      required:
        - firm_id
        - bank_account_id
        - voucher_type
        - party_id
        - counter_ledger_id
        - statement_date
        - statement_ref
        - amount
      properties:
        firm_id:
          type: string
          format: uuid
        bank_account_id:
          type: string
          format: uuid
        voucher_type:
          type: string
          enum: [RECEIPT, PAYMENT]
        party_id:
          type: string
          format: uuid
        counter_ledger_id:
          type: string
          format: uuid
        statement_date:
          type: string
          format: date
        statement_description:
          type: string
          maxLength: 500
          default: ''
        statement_ref:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          type: number
          format: double

    BankReconciliationUnmatchedAsVoucherResponse:
      type: object
      properties:
        voucher_id:
          type: string
          format: uuid
        series:
          type: string
        number:
          type: string
        voucher_date:
          type: string
          format: date
        voucher_type:
          type: string
        bank_reconciled_at:
          type: string
          format: date-time
        statement_ref:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Login and obtain JWT
      operationId: loginUser
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permission: public

  /auth/refresh:
    post:
      summary: Refresh JWT token
      operationId: refreshToken
      tags:
        - identity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permission: public

  /auth/logout:
    post:
      summary: Logout and revoke token
      operationId: logoutUser
      tags:
        - identity
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permission: public

  /auth/forgot:
    post:
      summary: Request a password-reset link (no enumeration leak)
      description: |
        Mints a one-time reset token and (in dev) prints the reset
        link to stdout via the console email adapter; in prod a real
        provider delivers the email. Returns the same `{ok: true}`
        envelope whether the email matches a real user or not — the
        response shape MUST NOT reveal user existence.
      operationId: forgotPassword
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - org_name
              properties:
                email:
                  type: string
                  format: email
                org_name:
                  type: string
      responses:
        '200':
          description: Reset link issued (or silently dropped — same shape either way)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '429':
          description: |
            Rate limit exceeded — CUT-501a applies a per-IP sliding
            window (5 reqs / 60s). Response carries a `Retry-After`
            header (seconds) and the standard error envelope with
            `code: "RATE_LIMIT_EXCEEDED"`.
          headers:
            Retry-After:
              schema:
                type: integer
                description: Seconds to wait before retrying.
      x-permission: public

  /auth/reset:
    post:
      summary: Consume a reset link and set a new password
      description: |
        Validates the 32-byte token (looked up by sha256(token) within
        the named org), rotates the user's password, marks the token
        used. Any failure (unknown / expired / consumed / malformed)
        returns 400 INVALID_RESET_TOKEN — the response never reveals
        WHICH branch tripped.
      operationId: resetPassword
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - org_name
                - new_password
              properties:
                token:
                  type: string
                org_name:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Reset link invalid or expired
      x-permission: public

  /auth/mfa/setup:
    post:
      summary: Begin MFA enrollment — generate TOTP secret (step 1 of 2)
      operationId: mfaSetup
      tags:
        - identity
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: TOTP provisioning data returned; mfa_enabled unchanged until /mfa/confirm
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - provisioning_uri
                properties:
                  secret:
                    type: string
                    description: Base32 TOTP secret to scan into authenticator app
                  provisioning_uri:
                    type: string
                    description: otpauth:// URI suitable for a QR code
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >
            MFA already enabled — contact an admin to reset before re-enrolling.
            Error code MFA_ALREADY_ENABLED.
      x-permission: authenticated
      x-note: >
        Requires a valid access token (Bearer). Does NOT set mfa_enabled=True.
        The caller must follow up with POST /auth/mfa/confirm to activate MFA.
        If mfa_enabled is already True, returns 409 to prevent token-based secret rebind.

  /auth/mfa/confirm:
    post:
      summary: Complete MFA enrollment — verify first TOTP code (step 2 of 2)
      operationId: mfaConfirm
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code generated by the authenticator after scanning the QR
      responses:
        '200':
          description: TOTP code verified; mfa_enabled set to True on the user
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid or already-used TOTP code. Error code INVALID_MFA_CODE.
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permission: authenticated
      x-note: >
        Requires a valid access token (Bearer). On success, sets mfa_enabled=True so
        subsequent logins require TOTP. On failure, mfa_enabled is unchanged.
        Uses the same TOTP replay guard as /auth/mfa-verify (Redis 90s TTL).

  /auth/mfa/enroll:
    post:
      x-implemented: false
      summary: Enroll in MFA
      operationId: enrollMFA
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - TOTP
                    - SMS
      responses:
        '200':
          description: MFA enrollment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: For TOTP, the secret to scan into authenticator app
                  challenge_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
      x-permission: user.mfa.enroll

  /auth/mfa/verify:
    post:
      x-implemented: false
      summary: Verify MFA code
      operationId: verifyMFA
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge_id
                - code
              properties:
                challenge_id:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permission: user.mfa.verify

  /me:
    get:
