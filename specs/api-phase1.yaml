      x-permission: sales.invoice.read

  /invoices/{sales_invoice_id}/discard:
    post:
      summary: Discard a DRAFT or CONFIRMED invoice (→ DISCARDED; nothing to reverse)
      description: >-
        invoice-lifecycle §2 DRAFT/CONFIRMED → DISCARDED. Nothing has posted
        (no GL voucher, no stock movement), so nothing is reversed. The row is
        KEPT with status DISCARDED and its number retained (numbers are
        allocated at draft time, so the series shows the voided number rather
        than a silent gap; the allocator never reuses it — PENDING MOIZ+CA).
        Discarded invoices are excluded from GSTR-1, AR / ageing, dashboards
        and the invoice list's default view (`?status=DISCARDED` lists them),
        and a linked delivery challan is released for re-billing (#209).
        Idempotent: discarding a DISCARDED invoice returns it unchanged.
        No dedicated discard permission exists; it reuses `sales.invoice.cancel`.
      operationId: discardInvoice
      tags:
        - sales
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/FirmId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sales_invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: Optional reason, recorded on the audit log.
      responses:
        '200':
          description: Invoice discarded (or already discarded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Invoice is past DRAFT/CONFIRMED (FINALIZED / paid / CANCELLED) —
            only a not-yet-finalized invoice can be discarded; cancel it instead.
      x-permission: sales.invoice.cancel

