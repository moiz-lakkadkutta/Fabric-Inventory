            is rejected when: the challan is unknown / deleted, belongs to a
            different firm or customer, is not ISSUED/ACKNOWLEDGED (e.g. still
            DRAFT), is already held by another live (non-cancelled) invoice —
            including one created concurrently — or the invoice's stockable
            lines don't bill exactly the challan's items and quantities
            (SERVICE lines such as freight may be added; partial billing of a
            challan is not supported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
