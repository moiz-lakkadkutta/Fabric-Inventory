    post:
      summary: Create delivery challan
      description: >
        Creates a DC in DRAFT state. When `sales_order_id` is set the linked SO
        must be CONFIRMED+ and the cumulative dispatch (this DC plus prior
        non-DRAFT DCs on the SO) must not exceed each SO line's ordered qty,
        aggregated per item; over-dispatch or an item not on the SO is rejected
        422 VALIDATION_ERROR (#206). This is early UX validation — the
        authoritative cap is enforced again at issue time under a row lock.
      operationId: createDeliveryChallan
      tags:
        - sales
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/FirmId'
        - $ref: '#/components/parameters/IdempotencyKey'
