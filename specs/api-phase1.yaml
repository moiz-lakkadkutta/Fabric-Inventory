            "not GST-registered" detail. (Such a firm's zero-rate lines are
            accepted and stored as `invoice_type = BILL_OF_SUPPLY`,
            `tax_type = NIL`, `gst_amount = 0`.) Also (#207): a computed
            line_amount or invoice total exceeding the ₹1e9 ceiling — even
            when each qty/price passes its own 1e9 cap — is rejected here
            (VALIDATION_ERROR) rather than overflowing NUMERIC(18,2) into 500.
