        no credit note (not cancelled, a same-period cancellation, or not a
        tax invoice for a supply — Bill of Supply, Cash Memo, Estimate,
        branch transfer).
      operationId: getInvoiceCreditNotePdf
      tags:
        - sales
      parameters:
