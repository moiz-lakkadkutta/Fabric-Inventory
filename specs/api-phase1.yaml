  /invoices/{sales_invoice_id}/cancel:
    post:
      summary: Cancel a finalized invoice (posts a reversing GL voucher)
      description: >-
        Cancels a FINALIZED (unpaid) sales invoice. Posts a
        reversing CREDIT_NOTE voucher (and reverses the COGS voucher +
        restores stock when present) so voucher-driven reports (TB, P&L,
        party statement, daybook) stay consistent with status-driven reports
        (GSTR-1, ageing). Idempotent.
        DC-linked invoices (DEBT-02 / #209): revenue and COGS are reversed
        but stock is NOT restored — the goods left with the delivery challan.
        The challan is released and can be billed on a new invoice.
        GST periods (#199, CA-review correction; periods are calendar months
        in Asia/Kolkata): the reversal, COGS reversal and stock restore are
        dated on the cancel date in IST (never before the invoice date). A
        SAME-PERIOD cancel is a true cancellation — GSTR-1 excludes the
        invoice. A CROSS-PERIOD cancel is a CGST Act §34 credit note — the
        original stays in its own month's GSTR-1 and the credit note is
        reported in the cancel month (cdnr / cdnur / b2cs net-off). A
        cross-period cancel after 30 November following the end of the
        invoice's financial year (April-March) is refused with 409 (§34(2)
        time limit).
        NUMBERING (#216): a cross-period (§34) credit note is numbered in the
        firm's own credit-note series `CN/<FY>/<serial>` (e.g. CN/26-27/0001;
        FY = Indian financial year, 1 April - 31 March, of the note date;
        gapless, restarting each 1 April; ≤16 chars per Rule 53(1A)(b)). Only
        a TAX INVOICE for a supply can carry a §34 note: a cross-period cancel
        of a Bill of Supply (non-GST firm), Cash Memo, Estimate or same-GSTIN
        branch transfer (NIL_NOT_A_SUPPLY) is not a credit note. Those, a
        same-period cancellation, and any pre-#190 duplicate reversal beyond
        the first, are internal `CXL/<FY>` vouchers ("Cancellation
        reversal") that never consume a credit-note serial and never appear
        in GSTR-1 CDNR / CDNUR. The response's
        `credit_note` carries the note number and date.
      operationId: cancelInvoice
      tags:
        - sales
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/FirmId'
        - name: sales_invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Why the invoice is being cancelled (required).
      responses:
        '200':
          description: Invoice cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Invoice cannot be cancelled — not finalized, already paid,
            or (#199) a cross-period cancel past
            the §34 credit-note time limit (30-Nov after the invoice's FY end).
      x-permission: sales.invoice.cancel

  /invoices/{sales_invoice_id}/credit-note/pdf:
    get:
      summary: Download the §34 credit note issued against a cancelled invoice
      description: >-
        (#216) Renders the credit note (CGST Rule 53(1A)) for an invoice that
        was cancelled in a later GST period: supplier name/address/GSTIN,
        "Credit Note", serial number (CN/<FY>/NNNN) and date of issue,
        recipient name/address/GSTIN (or, unregistered, address, place of
