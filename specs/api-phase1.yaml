        PIs may bill one GRN (partial billing); the qty cap is CUMULATIVE
        across the GRN's live PIs (create counts POSTED/RECONCILED + open
        DRAFTs; post, under a GRN row lock, counts POSTED/RECONCILED; VOIDED
        PIs are excluded). On post a GRN-linked PI clears GRN Clearing (2010)
        only for the billed qty × GRN rate and books PPV (5360) on that qty.
        AMOUNT/rate drift stays a loose non-blocking warning (rounding /
        freight / surcharge flexibility); only quantity over-billing is blocked.
      operationId: createPurchaseInvoice
      tags:
