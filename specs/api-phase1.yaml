              properties:
                sales_order_id:
                  type: string
                  format: uuid
                challan_date:
                  type: string
                  format: date
                lines:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Delivery challan created
          content:
            application/json:
              schema:
                type: object
        '422':
          description: >
            Validation error — e.g. over-dispatch beyond the SO's ordered qty,
            or a line item not on the linked SO (#206).
      x-permission: sales.dc.create

  /delivery-challans/{dc_id}/issue:
    post:
      summary: Issue a delivery challan (DRAFT -> ISSUED)
      description: >
        Posts each line's stock removal and, when linked to a SO, advances the
        SO status to PARTIAL_DC / FULLY_DISPATCHED. The linked SO row is locked
        FOR UPDATE and re-validated (#206): issuing against a CANCELLED (or
        DRAFT) SO is rejected 409 INVOICE_STATE_ERROR and the SO is never
        resurrected; cumulative dispatch exceeding the SO's ordered qty (per
        item) is rejected 422 VALIDATION_ERROR before any stock moves.
      operationId: issueDeliveryChallan
      tags:
        - sales
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/FirmId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: dc_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery challan issued
          content:
            application/json:
              schema:
                type: object
        '409':
          description: >
            Invalid state transition — DC not DRAFT, or the linked SO is
            CANCELLED/DRAFT (#206).
        '422':
          description: >
            Over-dispatch beyond the SO's ordered qty, or a line item not on
            the linked SO (#206).
      x-permission: sales.dc.approve

